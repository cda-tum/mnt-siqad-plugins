name: ❓ • Change Detection

# Decides which parts of CI run for a pull request. Every flag defaults to `true` off
# pull requests, because `push`, `merge_group`, and `workflow_dispatch` have no diff base
# to compare against — a merge group therefore always runs the full fleet.
#
# A workflow skipped by `on: paths:` never reports its status context at all, so it can
# never be a required check; a job skipped by one of these flags still lets the `🚦 Check`
# guard in `ci.yml` conclude. That difference is why filtering lives here instead.

on:
  workflow_call:
    outputs:
      run-cpp-tests:
        description: Whether to build and test the C++ plugins
        value: ${{ jobs.change-detection.outputs.run-cpp-tests || false }}
      run-cpp-linter:
        description: Whether to run Clang-Tidy and Clang-Format
        value: ${{ jobs.change-detection.outputs.run-cpp-linter || false }}
      run-codeql:
        description: Whether to run the CodeQL analysis
        value: ${{ jobs.change-detection.outputs.run-codeql || false }}
      run-workflows:
        description: Whether to audit the workflow definitions
        value: ${{ jobs.change-detection.outputs.run-workflows || false }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-change-detection
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  change-detection:
    name: 🕵️ Check
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read # required to check out the repository
    outputs:
      run-cpp-tests: ${{ steps.cpp-tests-changes.outputs.run-cpp-tests || false }}
      run-cpp-linter: ${{ steps.cpp-linter-changes.outputs.run-cpp-linter || false }}
      run-codeql: ${{ steps.codeql-changes.outputs.run-codeql || false }}
      run-workflows: ${{ steps.workflows-changes.outputs.run-workflows || false }}

    steps:
      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the changed files relevant for the C++ tests
        if: github.event_name == 'pull_request'
        id: changed-cpp-testable-files
        uses: Ana06/get-changed-files@25f79e676e7ea1868813e21465014798211fad8c # v2.3.0
        with:
          filter: |
            include/**
            plugins/**
            src/**
            test/**
            libs/**
            cmake/**
            CMakeLists.txt
            .github/workflows/ci.yml
            .github/workflows/change-detection.yml
            .github/workflows/cpp-tests-ubuntu.yml
            .github/workflows/cpp-tests-macos.yml
            .github/workflows/cpp-tests-windows.yml
      - name: Set a flag for running the C++ tests
        # `get-changed-files` only sees the base compare API's first 300 files; past that,
        # run unconditionally rather than risk a relevant file silently falling off the list
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.changed_files >= 300
          || steps.changed-cpp-testable-files.outputs.all != ''
        id: cpp-tests-changes
        run: echo "run-cpp-tests=true" >> "${GITHUB_OUTPUT}"

      - name: Get the changed files relevant for Clang-Tidy and Clang-Format
        if: github.event_name == 'pull_request'
        id: changed-cpp-linter-files
        uses: Ana06/get-changed-files@25f79e676e7ea1868813e21465014798211fad8c # v2.3.0
        with:
          filter: |
            include/**
            plugins/**
            src/**
            test/**
            libs/**
            cmake/**
            CMakeLists.txt
            .clang-format
            .clang-tidy
            .github/workflows/ci.yml
            .github/workflows/change-detection.yml
            .github/workflows/cpp-linter.yml
      - name: Set a flag for running Clang-Tidy and Clang-Format
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.changed_files >= 300
          || steps.changed-cpp-linter-files.outputs.all != ''
        id: cpp-linter-changes
        run: echo "run-cpp-linter=true" >> "${GITHUB_OUTPUT}"

      - name: Get the changed files relevant for CodeQL
        if: github.event_name == 'pull_request'
        id: changed-codeql-files
        uses: Ana06/get-changed-files@25f79e676e7ea1868813e21465014798211fad8c # v2.3.0
        with:
          filter: |
            include/**
            plugins/**
            src/**
            test/**
            libs/**
            cmake/**
            CMakeLists.txt
            .github/workflows/ci.yml
            .github/workflows/change-detection.yml
            .github/workflows/codeql.yml
      - name: Set a flag for running CodeQL
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.changed_files >= 300
          || steps.changed-codeql-files.outputs.all != ''
        id: codeql-changes
        run: echo "run-codeql=true" >> "${GITHUB_OUTPUT}"

      - name: Get the changed workflow definitions
        if: github.event_name == 'pull_request'
        id: changed-workflow-files
        uses: Ana06/get-changed-files@25f79e676e7ea1868813e21465014798211fad8c # v2.3.0
        with:
          filter: |
            .github/workflows/**
      - name: Set a flag for auditing the workflow definitions
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.changed_files >= 300
          || steps.changed-workflow-files.outputs.all != ''
        id: workflows-changes
        run: echo "run-workflows=true" >> "${GITHUB_OUTPUT}"
