name: 🚨 • C++ Linter

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-linter
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  cpp-linter:
    name: 🚨 Clang-Tidy & Clang-Format
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required to check out the repository
      pull-requests: write # required to post/update the clang-tidy thread comment on the PR

    steps:
      - name: Install libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout 10m sudo -E apt-get update -o Acquire::Retries=3
          timeout 10m sudo -E apt-get install -yq -o Acquire::Retries=3 libboost-all-dev libtbb-dev

      - name: Clone Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Unity builds and PCH collapse translation units, which loses clang-tidy's
      # per-file mapping — keep both off for the compile database used here.
      - name: Generate compilation database
        run: >
          cmake -S . -B build
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMNT_SIQAD_PLUGINS_TEST=ON

      - name: Run clang-tidy & clang-format
        id: linter
        uses: cpp-linter/cpp-linter-action@cab1143a2c149bc41e85b070a9de81716974c18f # v2.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: file
          tidy-checks: ""
          database: build
          step-summary: true
          thread-comments: ${{ ((github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork) && 'update') || 'false' }}
          ignore: "build-*|libs/*"
          version: "21"

      - if: steps.linter.outputs.checks-failed > 0
        run: exit 1
